[build]
  publish = "dist/apps/tangle-dapp"
  command = "yarn nx build tangle-dapp"

  # This `netlify.toml` is consumed by two sites that both build the same
  # app from this monorepo path:
  #   * tangle-dapp         → app.tangle.tools           (master, production)
  #   * staging-tangle-dapp → develop.app.tangle.tools   (develop, staging)
  # Each site is locked to a single branch via `allowed_branches`.
  # Deploy previews inherit the staging site. Netlify owns change detection.

# ─── Cache headers ──────────────────────────────────────────────────────
#
# Vite emits hashed filenames into /assets, so the file at any given URL
# is content-addressed and safe to mark immutable. Repeat-visit loads
# become near-instant because the browser doesn't even revalidate.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts are also content-addressed when present; mark them immutable and
# permit cross-origin use so they can be loaded from sibling subdomains.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# index.html must NOT be cached aggressively — it's the entry point that
# references the hashed asset bundles, so it has to be replaced atomically
# on every deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ─── Agent-facing surfaces ──────────────────────────────────────────────
#
# /llms.txt and /.well-known/tangle-agent.json are real files under
# public/, so Netlify's static-file shadowing serves them ahead of the
# SPA fallback in public/_redirects (which is unforced). Pin their content
# types and keep them revalidating so manifest updates take effect on the
# next request.
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/.well-known/tangle-agent.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
