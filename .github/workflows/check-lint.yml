name: 'Clean 🧹'

on:
  pull_request:
    branches: [develop, master, feature/**]

  workflow_dispatch:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['>=18.18.x']
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v7

      - name: Enable corepack
        run: |
          corepack enable

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - name: lint
        run: |
          yarn install
          yarn format:check
          yarn nx run-many --all --target=lint

  format:
    name: format
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['>=18.18.x']
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v7

      - name: Enable corepack
        run: |
          corepack enable

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - name: prettier
        run: |
          yarn install
          yarn format:check

  links:
    name: links
    runs-on: ubuntu-latest
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v7

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          # Ignore the README.md file as some social sharing links are not valid
          # Each app's HTML has root-relative asset paths that need its served root.
          # Check Markdown here and each app's source HTML against its root below.
          args: --verbose --no-progress --exclude-path 'README.md' './**/*.md' './**/*.rst'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check source HTML links
        run: |
          set -euo pipefail
          for app in leaderboard tangle-cloud tangle-dapp; do
            app_dir="$GITHUB_WORKSPACE/apps/$app"
            root_dir="$RUNNER_TEMP/lychee-html/$app"
            # Vite serves public files at / and source files at /src.
            mkdir -p "$root_dir"
            cp -a "$app_dir/public/." "$root_dir/"
            ln -s "$app_dir/src" "$root_dir/src"
            lychee --offline --no-progress --root-dir "$root_dir" "$app_dir/index.html"
          done
