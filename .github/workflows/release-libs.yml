name: 'Release Libraries 📦'

on:
  push:
    branches:
      - develop

    paths:
      - 'libs/**/CHANGELOG.md'

  workflow_dispatch:

jobs:
  # Runs on the self-hosted runners and decides whether this push publishes:
  # the hosted publish job starts only when a library CHANGELOG changed.
  pre-ci:
    runs-on: [self-hosted, ci-public]
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.detect.outputs.publish }}
      libs: ${{ steps.detect.outputs.libs }}
    steps:
      - name: 'Block Concurrent Executions'
        uses: softprops/turnstyle@v1
        with:
          poll-interval-seconds: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 'Changed Files'
        uses: tj-actions/changed-files@v46
        id: changed-files
        with:
          files: 'libs/**/CHANGELOG.md'
          separator: ','

      - name: 'Detect Libraries to Publish'
        id: detect
        run: |
          echo "Changed Files: ${{ steps.changed-files.outputs.all_changed_files }}"

          # Extract library names from changed files paths and create comma-separated list
          LIBS_TO_PUBLISH=$(echo "${{ steps.changed-files.outputs.all_changed_files }}" | \
            tr ',' '\n' | \
            grep -o 'libs/[^/]*' | \
            sed 's/libs\///' | \
            tr '\n' ',' | \
            sed 's/,$//')

          echo "Libraries to publish: $LIBS_TO_PUBLISH"
          echo "libs=$LIBS_TO_PUBLISH" >> "$GITHUB_OUTPUT"
          if [ -n "$LIBS_TO_PUBLISH" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  # npm provenance needs OIDC from a GitHub-hosted runner.
  build-publish:
    name: Build and Publish
    needs: pre-ci
    if: needs.pre-ci.outputs.publish == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      id-token: write

    env:
      LIBS_TO_PUBLISH: ${{ needs.pre-ci.outputs.libs }}

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enable corepack
        run: |
          corepack enable

      - name: Setup Node.js environment
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '>=18.18.x'
          cache: yarn
          registry-url: https://registry.npmjs.org/

      - name: Install deps
        run: yarn install
        shell: bash

      - name: Print Environment Info
        run: yarn nx report
        shell: bash

      - name: Build
        # Fix: JavaScript heap out of memory
        # https://github.com/actions/runner-images/issues/70#issuecomment-1191708172
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: yarn nx run-many --target=build --projects $LIBS_TO_PUBLISH
        shell: bash

      - name: Publish libraries
        uses: ./.github/actions/create-lib-release
        with:
          projects: $LIBS_TO_PUBLISH
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          npm-token: ${{ secrets.NPM_ACCESS_TOKEN }}
